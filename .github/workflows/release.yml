name: Validate and publish CLI release

on:
  push:
    branches:
      - "candidate/**"

permissions:
  contents: read

concurrency:
  group: cli-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Audit candidate archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out candidate assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify candidate branch and assets
        id: release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#candidate/}"
          test "$GITHUB_REF_NAME" = "candidate/$tag"
          node scripts/verify-candidate-branch.mjs "$tag" "$GITHUB_SHA"
          node scripts/verify-release-assets.mjs release-assets "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  candidate-smoke:
    name: Install candidate and test MCP (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the exact candidate archive and test both commands plus MCP
        run: node scripts/smoke-cli-candidate.mjs "$GITHUB_WORKSPACE/release-assets/kooya-cli.tgz" "${{ needs.validate.outputs.version }}"

  publish:
    name: Tag and publish validated release
    needs: [validate, candidate-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck candidate branch head before release write
        run: node scripts/verify-candidate-branch.mjs "${{ needs.validate.outputs.tag }}" "$GITHUB_SHA"
      - name: Create immutable version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          gh auth setup-git
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            verify_ref="refs/tags/verify-$tag"
            git fetch --no-tags origin "refs/tags/$tag:$verify_ref"
            test "$(git rev-parse "$verify_ref^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "KooyaHQ CLI $tag"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json tagName --jq .tagName)" = "$tag"
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false"
            download_dir="$(mktemp -d)"
            trap 'rm -rf "$download_dir"' EXIT
            gh release download "$tag" --dir "$download_dir"
            actual_assets="$(find "$download_dir" -maxdepth 1 -type f -printf '%f\n' | sort)"
            expected_assets="$(printf '%s\n' kooya-cli.tgz kooya-cli.tgz.sha256 | sort)"
            test "$actual_assets" = "$expected_assets"
            cmp --silent release-assets/kooya-cli.tgz "$download_dir/kooya-cli.tgz"
            cmp --silent release-assets/kooya-cli.tgz.sha256 "$download_dir/kooya-cli.tgz.sha256"
          else
            gh release create "$tag" \
              --verify-tag \
              release-assets/kooya-cli.tgz \
              release-assets/kooya-cli.tgz.sha256 \
              --title "KooyaHQ CLI $tag" \
              --generate-notes
          fi

  public-smoke:
    name: Verify public install, updater, and MCP (${{ matrix.os }})
    needs: [validate, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unauthenticated download, update, profile preservation, and MCP handshake
        run: node scripts/smoke-cli-public.mjs "${{ needs.validate.outputs.version }}"
