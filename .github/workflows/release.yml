name: Release CLI assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release assets
        run: node scripts/verify-release-assets.mjs release-assets "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/kooya-cli.tgz
          release-assets/kooya-cli.tgz.sha256
          --title "KooyaHQ CLI $GITHUB_REF_NAME"
          --generate-notes
