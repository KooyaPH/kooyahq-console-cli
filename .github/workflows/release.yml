name: Release CLI assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the published tag still targets this event commit
        shell: bash
        run: |
          set -euo pipefail
          verify_ref="refs/tags/verify-$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:$verify_ref"
          tag_commit="$(git rev-parse "$verify_ref^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"

      - name: Verify release assets
        run: node scripts/verify-release-assets.mjs release-assets "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          release-assets/kooya-cli.tgz
          release-assets/kooya-cli.tgz.sha256
          --title "KooyaHQ CLI $GITHUB_REF_NAME"
          --generate-notes
