name: Verify published CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Latest stable version to verify (for example, 0.5.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-smoke:
    name: Verify public install, updater, and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unauthenticated install, update, profile preservation, and MCP
        run: node scripts/smoke-cli-public.mjs "${{ inputs.version }}"
