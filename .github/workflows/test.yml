name: Release repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/verify-release-assets.test.mjs
